<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style.css">
    <title>SIGN UP</title>
</head>
<body>
    <main>
        <div class="login-container">
            <h1>Create Account</h1>
            <p class="subtitle">Join us today by filling out your info</p>
            <form action="">
                <div class="input-group">
                    <label for="fname">Full Name:</label>
                    <input type="text" name="signup-firstname" id="Full Name:">
                </div>
                <div class="input-group">
                    <label for="em">Email Address:</label>
                    <input type="email" name="Signup-email" id="Email Address">
                </div>
                <div class="input-group">
                    <label for="ps">Password:</label>
                    <input type="Password" name="Signup-password" id="Password">
                </div>
                <button type="submit" class="signup-btn">Sign up</button>
            </form>
            <p class="switch-text">Already have an account?
                <a href="./Signin.html" class="switch-link">Sign in</a>
            </p>
        </div>
    </main>
    
</body>
</html>
